<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home Assistant</title>
<link rel="stylesheet" href="_sdk/nullobj.css">
</head>
<body>
<div class="section"><h4 class="caps">Connection</h4><span class="hint">Shared by all keys</span></div>
<div class="field"><label for="baseUrl">Base URL</label><input class="input" id="baseUrl" placeholder="https://homeassistant.local:8123"></div>
<div class="field"><label for="token">Long-lived access token</label><input class="input" id="token" type="password" autocomplete="off"></div>
<div class="section"><h4 class="caps">This key</h4></div>
<div class="field"><label for="service">Service</label><input class="input" id="service" placeholder="light.toggle"></div>
<div class="field"><label for="entity">Entity ID</label><input class="input" id="entity" placeholder="light.desk"></div>
<div class="field"><label for="data">Extra data (JSON object, optional)</label><textarea class="input" id="data" rows="3" placeholder='{"brightness_pct": 50}'></textarea></div>
<div class="field"><label for="label">Label (optional)</label><input class="input" id="label" maxlength="40"></div>
<div class="field"><label class="check" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);font-weight:500"><input id="showState" type="checkbox"> Show entity state on the key</label></div>
<script>
let ws, uuid, ctx;
const keyFields = ['service', 'entity', 'data', 'label'];
const globalFields = ['baseUrl', 'token'];
const $ = (id) => document.getElementById(id);
function send(o) { ws.send(JSON.stringify(o)); }
let globalLoaded = false;
function saveKey() {
  const s = {};
  keyFields.forEach((f) => (s[f] = $(f).value));
  s.showState = $('showState').checked;
  send({ event: 'setSettings', context: uuid, payload: s });
}
// Only sent after the stored values have loaded, so an early edit can never blank the saved token.
function saveGlobal() {
  if (!globalLoaded) return;
  const g = {};
  globalFields.forEach((f) => (g[f] = $(f).value));
  send({ event: 'setGlobalSettings', context: uuid, payload: g });
}
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  const ai = JSON.parse(actionInfo);
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => {
    send({ event: registerEvent, uuid });
    send({ event: 'getGlobalSettings', context: uuid });
  };
  ws.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.event === 'didReceiveGlobalSettings') {
      globalFields.forEach((f) => ($(f).value = (ev.payload.settings || {})[f] || ''));
      globalLoaded = true;
    }
  };
  const s = (ai.payload && ai.payload.settings) || {};
  keyFields.forEach((f) => ($(f).value = s[f] || ''));
  $('showState').checked = !!s.showState;
  keyFields.concat('showState').forEach((f) => $(f).addEventListener('change', saveKey));
  globalFields.forEach((f) => $(f).addEventListener('change', saveGlobal));
}
</script>
</body>
</html>
