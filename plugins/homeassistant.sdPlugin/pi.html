<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home Assistant</title>
<style>
  body { font: 13px sans-serif; background: #2d2d2d; color: #ddd; padding: 8px; }
  label { display: block; margin: 8px 0 2px; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1e1e1e; color: #eee; border: 1px solid #555; padding: 4px; }
  h4 { margin: 14px 0 0; }
</style>
</head>
<body>
<h4>Connection (shared by all keys)</h4>
<label>Base URL</label><input id="baseUrl" placeholder="https://homeassistant.local:8123">
<label>Long-lived access token</label><input id="token" type="password">
<h4>This key</h4>
<label>Service</label><input id="service" placeholder="light.toggle">
<label>Entity ID</label><input id="entity" placeholder="light.desk">
<label>Extra data (JSON, optional)</label><textarea id="data" rows="3" placeholder='{"brightness_pct": 50}'></textarea>
<label>Label (optional)</label><input id="label">
<label><input id="showState" type="checkbox" style="width:auto"> Show entity state on the key</label>
<script>
let ws, uuid, ctx;
const keyFields = ['service', 'entity', 'data', 'label'];
const globalFields = ['baseUrl', 'token'];
const $ = (id) => document.getElementById(id);
function send(o) { ws.send(JSON.stringify(o)); }
let globalLoaded = false;
function saveKey() {
  const s = {};
  keyFields.forEach((f) => (s[f] = $(f).value));
  s.showState = $('showState').checked;
  send({ event: 'setSettings', context: uuid, payload: s });
}
// Only sent after the stored values have loaded, so an early edit can never blank the saved token.
function saveGlobal() {
  if (!globalLoaded) return;
  const g = {};
  globalFields.forEach((f) => (g[f] = $(f).value));
  send({ event: 'setGlobalSettings', context: uuid, payload: g });
}
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  const ai = JSON.parse(actionInfo);
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => {
    send({ event: registerEvent, uuid });
    send({ event: 'getGlobalSettings', context: uuid });
  };
  ws.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.event === 'didReceiveGlobalSettings') {
      globalFields.forEach((f) => ($(f).value = (ev.payload.settings || {})[f] || ''));
      globalLoaded = true;
    }
  };
  const s = (ai.payload && ai.payload.settings) || {};
  keyFields.forEach((f) => ($(f).value = s[f] || ''));
  $('showState').checked = !!s.showState;
  keyFields.concat('showState').forEach((f) => $(f).addEventListener('change', saveKey));
  globalFields.forEach((f) => $(f).addEventListener('change', saveGlobal));
}
</script>
</body>
</html>
